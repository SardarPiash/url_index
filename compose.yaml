services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer_local
      POSTGRES_DB: indexer_lab
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d indexer_lab"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
